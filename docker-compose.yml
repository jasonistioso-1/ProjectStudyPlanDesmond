services:
  # Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: spr-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: spr_db
      MYSQL_USER: spr_user
      MYSQL_PASSWORD: spr_password
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service (Express Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spr-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: spr_user
      DB_PASSWORD: spr_password
      DB_NAME: spr_db
    depends_on:
      db:
        condition: service_healthy

  # Frontend Web App Service (Vite React UI)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spr-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
